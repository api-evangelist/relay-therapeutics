name: Relay Therapeutics
description: Relay Therapeutics is a clinical-stage precision-medicine company in Cambridge, Massachusetts
  that discovers and develops small-molecule therapeutics for cancer and genetic disease. Its proprietary
  Dynamo platform combines computational and experimental approaches — motion-based drug discovery, protein-motion
  simulation, structural biology, and biophysics — to drug targets that have historically been difficult
  to reach. The company advances a pipeline of oncology and precision-medicine candidates. Relay Therapeutics
  was surfaced as a portfolio company of SoftBank Vision Fund and added to the API Evangelist network.
  As a biotechnology / drug-discovery company it publishes no public developer API, SDK, or webhook surface;
  this profile captures its corporate identity and web properties.
